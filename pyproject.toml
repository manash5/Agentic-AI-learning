[project]
name = "langgraph-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "deepagents>=0.7.8",
    "faiss-cpu>=1.15.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.15",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "langgraph-cli[inmem]>=0.4.31",
    "langsmith>=0.11.0",
    "mcp>=1.29.0",
    "pageindex>=0.2.10",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=6.0.0",
    "streamlit>=1.62.0",
    "tavily-python>=0.7.27",
    "tiktoken>=0.14.0",
    "torch>=2.13.0",
    "transformers>=5.15.0",
]

[project.scripts]
langgraph-learning = "langgraph_learning:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
